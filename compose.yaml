services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: videomasys
      POSTGRES_USER: videomasys
      POSTGRES_PASSWORD: videomasys
    ports:
      - "5432:5432"
    volumes:
      - videomasys-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videomasys -d videomasys"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  videomasys-postgres:


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "videomasys"
version = "0.1.0"
description = "QA-first, cache-centric multi-agent video understanding prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
videomasys-api = "videomasys.api.app:run"
videomasys-worker = "videomasys.worker:run"
videomasys-init-db = "videomasys.storage.db:run_init"
videomasys-eval = "videomasys.evaluation.runner:run"

[tool.hatch.build.targets.wheel]
packages = ["src/videomasys"]

[tool.hatch.build]
include = [
  "src/videomasys/**/*.py",
  "src/videomasys/web/*.html",
  "src/videomasys/web/*.css",
  "src/videomasys/web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
